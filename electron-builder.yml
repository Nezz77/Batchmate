appId: com.antigravity.batchmate
productName: Batchmate
copyright: Copyright © 2026 Antigravity

directories:
  output: release
  buildResources: build

# The Prisma client is generated to src/generated/prisma-client — a normal
# (non-hidden) directory that electron-builder's glob includes automatically.
# The .node query engine inside it is unpacked from ASAR via asarUnpack.
files:
  - dist/**/*
  - dist-electron/**/*
  - src/generated/prisma-client/**/*
  - node_modules/@prisma/client/**/*
  - node_modules/@prisma/engines/**/*
  - prisma/schema.prisma
  - "!node_modules/.cache/**/*"
  - "!.venv"
  - "!.venv/**/*"

asarUnpack:
  - src/generated/prisma-client/*.node
  - node_modules/@prisma/engines/**/*

extraResources:
  - from: app_icons/
    to: app_icons/
  - from: prisma/dev.db
    to: batchmate.db

mac:
  icon: app_icons/batchmate.png
  category: public.app-category.education
  target:
    - dmg

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
