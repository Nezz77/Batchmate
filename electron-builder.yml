appId: com.antigravity.batchmate
productName: Batchmate
copyright: Copyright © 2026 Antigravity

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - prisma/schema.prisma
  - prisma/migrations/**/*
  - "!node_modules/.cache/**/*"
  - "!node_modules/.vite/**/*"
  - "!.venv"
  - "!.venv/**/*"

# Unpack native binaries from ASAR so they can be loaded at runtime
asarUnpack:
  - node_modules/.prisma/**/*
  - node_modules/@prisma/engines/**/*
  - node_modules/@prisma/client/**/*

extraResources:
  - from: app_icons/
    to: app_icons/
  - from: prisma/dev.db
    to: batchmate.db

mac:
  icon: app_icons/batchmate.png
  category: public.app-category.education
  target:
    - dmg

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
